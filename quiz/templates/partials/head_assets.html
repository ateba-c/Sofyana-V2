{# Shared <head> assets of the child app (Tailwind theme, fonts, Alpine, htmx, base CSS). Also used by the QA Studio simulator. #}
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand:  { DEFAULT: '#F97316', dark: '#EA580C', light: '#FFF7ED' },
            coral:  { DEFAULT: '#EF4444', dark: '#DC2626', light: '#FEF2F2' },
            teal:   { DEFAULT: '#0EA5E9', dark: '#0284C7', light: '#E0F2FE' },
            lime:   { DEFAULT: '#84CC16', dark: '#65A30D', light: '#F7FEE7' },
            pink:   { DEFAULT: '#EC4899', dark: '#DB2777', light: '#FCE7F3' },
            amber:  { DEFAULT: '#F59E0B', dark: '#D97706', light: '#FFFBEB' },
            ink:    '#1C1018',
            soft:   '#FFF8F0',
          },
          fontFamily: {
            sans:    ['Nunito', 'system-ui', 'sans-serif'],
            display: ['"Baloo 2"', 'Nunito', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            soft:   '0 8px 32px rgba(15, 23, 42, 0.08)',
            card:   '0 2px 12px rgba(15, 23, 42, 0.07)',
            glow:   '0 0 20px rgba(249, 115, 22, 0.28)',
            warm:   '0 6px 24px rgba(249, 115, 22, 0.20)',
          },
          animation: {
            'slide-up': 'slideUp .35s ease',
            'pop':      'pop .3s ease',
            'bounce-in':'bounceIn .4s cubic-bezier(.36,.07,.19,.97)',
            'float':    'float 3s ease-in-out infinite',
          },
          keyframes: {
            slideUp:   { from: { opacity:'0', transform:'translateY(16px)' }, to: { opacity:'1', transform:'translateY(0)' } },
            pop:       { from: { opacity:'0', transform:'scale(.94)' },        to: { opacity:'1', transform:'scale(1)' } },
            bounceIn:  { '0%': {transform:'scale(.8)',opacity:'0'}, '60%': {transform:'scale(1.05)'}, '100%': {transform:'scale(1)',opacity:'1'} },
            float:     { '0%,100%': {transform:'translateY(0)'}, '50%': {transform:'translateY(-8px)'} },
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    [x-cloak] { display: none !important; }
    :root {
      --page-bg:    #F1F5F9;
      --surface:    #FFFFFF;
      --surface-strong: #FFFFFF;
      --stroke:     #CBD5E1;
      --text-main:  #1C1018;
      --text-soft:  #78490A;
      --sidebar-bg: #FFFFFF;
    }
    body {
      min-height: 100vh;
      background: var(--page-bg);
      color: var(--text-main);
    }
    .card-glass {
      background: var(--surface);
      border: 1.5px solid var(--stroke);
      box-shadow: 0 2px 16px rgba(15, 23, 42, 0.06);
    }
    .card-solid {
      background: var(--surface-strong);
      border: 1.5px solid var(--stroke);
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.05);
    }
    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 0.875rem;
      border-radius: 1.1rem;
      padding: 0.85rem 1rem;
      font-weight: 800;
      color: #9A3412;
      transition: .15s ease;
    }
    .sidebar-link:hover {
      background: rgba(249, 115, 22, 0.09);
      color: #F97316;
      transform: translateX(2px);
    }
    .sidebar-link.active {
      background: linear-gradient(135deg, #F97316, #FB923C);
      color: white;
      box-shadow: 0 8px 20px rgba(249, 115, 22, 0.30);
    }
    .sidebar-icon {
      width: 2.1rem;
      height: 2.1rem;
      border-radius: 0.75rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.55);
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .sidebar-link.active .sidebar-icon { background: rgba(255,255,255,0.2); }
    .progress-bar { transition: width 0.6s cubic-bezier(.4,0,.2,1); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(249, 115, 22, 0.2); border-radius: 999px; }
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .bottom-nav { padding-bottom: env(safe-area-inset-bottom); }
    }
    .main-content { padding-bottom: 5.5rem; padding-top: 0.5rem; }
    @media (min-width: 1024px) { .main-content { padding-bottom: 0; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
