{% with cur_lang=lang|default:'en' %}<!DOCTYPE html>
<html lang="{{ cur_lang }}">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Sofyana{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand:  { DEFAULT: '#F97316', dark: '#EA580C', light: '#FFF7ED' },
            coral:  { DEFAULT: '#EF4444', dark: '#DC2626', light: '#FEF2F2' },
            teal:   { DEFAULT: '#0EA5E9', dark: '#0284C7', light: '#E0F2FE' },
            lime:   { DEFAULT: '#84CC16', dark: '#65A30D', light: '#F7FEE7' },
            amber:  { DEFAULT: '#F59E0B', dark: '#D97706', light: '#FFFBEB' },
            ink:    '#1C1018',
            soft:   '#FFF8F0',
          },
          fontFamily: {
            sans:    ['Nunito', 'system-ui', 'sans-serif'],
            display: ['"Baloo 2"', 'Nunito', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            card: '0 8px 24px rgba(28, 16, 24, 0.08)',
            warm: '0 12px 40px rgba(249, 115, 22, 0.18)',
          },
          animation: {
            'float': 'float 3s ease-in-out infinite',
          },
          keyframes: {
            float: { '0%,100%': {transform:'translateY(0)'}, '50%': {transform:'translateY(-10px)'} },
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --text-soft: #3B4D8A;
    }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #EEF2FF 0%, #FFFFFF 50%, #EFF6FF 100%);
      color: #1C1018;
      font-family: 'Nunito', system-ui, sans-serif;
    }
    .card-solid {
      background: rgba(255,255,255,0.98);
      border: 1.5px solid rgba(99, 102, 241, 0.10);
      box-shadow: 0 8px 24px rgba(28, 16, 24, 0.06);
    }
    .card-glass {
      background: rgba(255,255,255,0.92);
      border: 1.5px solid rgba(99, 102, 241, 0.13);
      box-shadow: 0 10px 32px rgba(99, 102, 241, 0.07);
      backdrop-filter: blur(12px);
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body class="font-sans antialiased">
  <!-- Horizontal nav -->
  <header style="position:sticky;top:0;z-index:50;background:rgba(255,255,255,0.88);backdrop-filter:blur(14px);border-bottom:1px solid rgba(99,102,241,0.10);">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-5 py-3 sm:px-8">
      <!-- Logo -->
      <a href="/?lang={{ cur_lang }}" class="flex items-center gap-2.5 shrink-0">
        <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-gradient-to-br from-amber to-brand text-xl shadow-card">⭐</div>
        <span class="font-display text-2xl font-extrabold" style="color:#1C1018">Sofyana</span>
      </a>
      <!-- Right: lang + CTA -->
      <div class="flex items-center gap-2">
        <div class="flex rounded-xl p-0.5" style="border:1px solid #FED7AA;background:white">
          <a href="?lang=en" class="rounded-[0.55rem] px-3 py-1.5 text-xs font-black transition {% if cur_lang == 'en' %}bg-brand text-white{% else %}text-brand/60 hover:text-brand{% endif %}">EN</a>
          <a href="?lang=fr" class="rounded-[0.55rem] px-3 py-1.5 text-xs font-black transition {% if cur_lang == 'fr' %}bg-brand text-white{% else %}text-brand/60 hover:text-brand{% endif %}">FR</a>
        </div>
        <a href="{% url 'quiz:login' %}?lang={{ cur_lang }}"
           class="rounded-xl px-4 py-2.5 text-sm font-black transition hidden sm:block"
           style="border:1px solid #FED7AA;background:white;color:#F97316">
          {% if cur_lang == 'fr' %}Connexion{% else %}Log in{% endif %}
        </a>
        <a href="{% url 'quiz:register' %}?lang={{ cur_lang }}"
           class="rounded-xl px-5 py-2.5 text-sm font-black text-white shadow-card transition hover:opacity-90"
           style="background:#F97316">
          {% if cur_lang == 'fr' %}Commencer{% else %}Start free{% endif %}
        </a>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-5 py-4 sm:px-8 sm:py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>{% endwith %}
